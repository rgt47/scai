# Base configuration shared by every build of the merged book.
#
# Chapter lists live only in the profile files, never here. Quarto
# merges a profile into this base, and keeping the lists out of the
# base means no build depends on how that merge treats arrays.
#
#   quarto render --profile html            # full book, website
#   quarto render --profile vol1 --to pdf   # Volume I, first quarter
#   quarto render --profile vol2 --to pdf   # Volume II, second quarter

project:
  pre-render:
    - ../../tools/us-spelling
  type: book

profile:
  default: html

book:
  title: 'Statistical Computing in the Age of AI'
  author: 'The rgtlab Curriculum Project'
  date: today
  date-format: 'YYYY-MM-DD'

  favicon: images/favicon.png

  site-url: https://scai.rgtlab.org
  repo-url: https://github.com/rgt47/scai
  repo-branch: main
  repo-actions: [edit, issue]

  search: true
  page-navigation: true
  bread-crumbs: true
  sidebar:
    style: docked
    collapse-level: 1

format:
  html:
    theme:
      - cosmo
      - scai.scss
    include-after-body: nav-toggle.html
    code-annotations: hover
    code-link: true
    code-copy: hover
    code-overflow: wrap
    code-tools:
      source: repo
      toggle: false
    code-block-bg: true
    code-block-border-left: '#1f4e79'
    highlight-style: arrow
    fig-width: 7
    fig-height: 4.5
    fig-align: center
    tbl-cap-location: top
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true

  pdf:
    pdf-engine: xelatex
    documentclass: scrbook
    classoption: [11pt, openany]
    callout-appearance: simple
    toc: true
    toc-depth: 2
    code-annotations: below
    highlight-style: arrow
    geometry:
      - paperwidth=6.5in
      - paperheight=9in
      - top=0.9in
      - bottom=0.9in
      - inner=0.9in
      - outer=0.7in

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: '#>'
    collapse: true
    fig.retina: 2
    dpi: 150
