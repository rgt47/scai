# Base configuration shared by every build of the merged book.
#
# Chapter lists live only in the profile files, never here. Quarto
# merges a profile into this base, and keeping the lists out of the
# base means no build depends on how that merge treats arrays.
#
#   quarto render --profile html            # full book, website
#   quarto render --profile vol1 --to pdf   # Volume I, first quarter
#   quarto render --profile vol2 --to pdf   # Volume II, second quarter

project:
  pre-render:
    - ../../tools/us-spelling
    - ../../tools/make-contents.py
  type: book
  resources:
    - _redirects

profile:
  default: html

# DRAFT: delete this block at release. Quarto reads the banner only
# from website:, and a book project does not copy it over from book:.
website:
  announcement:
    icon: info-circle
    dismissable: true
    content: >-
      **Draft.** This book is under active development, and
      chapters may change. Please use 'Report an issue' to flag
      problems.
    type: warning
    position: below-navbar

book:
  title: 'Statistical Computing in the Age of AI'
  author: 'rgtlab curriculum team'
  date: today
  date-format: 'YYYY-MM-DD'

  favicon: images/favicon.png

  site-url: https://scai.rgtlab.org
  repo-url: https://github.com/rgt47/scai
  repo-branch: main
  repo-actions: [edit, issue]
  # Sidebar 'Download PDF' link; CI builds the PDF with the site.
  downloads: [pdf]

  search: true
  page-navigation: true
  bread-crumbs: true
  sidebar:
    style: docked
    collapse-level: 1

format:
  html:
    theme:
      - cosmo
      - scai.scss
    include-after-body: nav-toggle.html
    code-annotations: hover
    code-link: true
    code-copy: hover
    code-overflow: wrap
    code-tools:
      source: repo
      toggle: false
    code-block-bg: true
    code-block-border-left: '#1f4e79'
    highlight-style: arrow
    fig-width: 7
    fig-height: 4.5
    fig-align: center
    tbl-cap-location: top
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true

  pdf:
    pdf-engine: xelatex
    documentclass: scrbook
    classoption: [11pt, openany]
    callout-appearance: simple
    toc: true
    toc-depth: 2
    code-annotations: below
    highlight-style: arrow
    geometry:
      - paperwidth=6.5in
      - paperheight=9in
      - top=0.9in
      - bottom=0.9in
      - inner=0.9in
      - outer=0.7in
    include-in-header:
      text: |
        % DRAFT: delete this line, and the matching footer block,
        % at release.
        \usepackage{eso-pic}
    include-before-body:
      text: |
        % DRAFT: delete at release. eso-pic draws on every page from
        % here on, whatever the page style, so the KOMA headers and
        % page numbers are untouched and the title page stays clean.
        \AddToShipoutPictureFG{%
          \AtPageLowerLeft{\makebox[\paperwidth]{\raisebox{0.15in}{%
            \footnotesize\sffamily\color{gray}%
            Draft, \today. Content may change.}}}}

filters:
  - _filters/contents-html-only.lua

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: '#>'
    collapse: true
    fig.retina: 2
    dpi: 150
